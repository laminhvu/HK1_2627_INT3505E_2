openapi: 3.0.3

info:
  title: Tasks API - POST Operations
  version: 1.0.0
  description: Đặc tả API tạo task mới.

servers:
  - url: http://localhost:5001/v1
    description: Flask local development server

tags:
  - name: tasks
    description: Quản lý công việc

security:
  - bearerAuth: []

paths:
  /tasks:
    post:
      tags: [tasks]
      summary: Tạo task mới
      description: >
        Tạo một task mới từ dữ liệu được gửi trong request body.
        Nếu dữ liệu không hợp lệ, trả về lỗi 422.
      operationId: createTask

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
            example:
              title: Hoàn thành bài tập SOA
              status: TODO
              priority: HIGH
              dueDate: '2026-10-15'
              assigneeId: '22222222-2222-4222-8222-222222222222'

      responses:
        '201':
          description: Tạo task thành công
          headers:
            Location:
              description: URL của task vừa được tạo
              schema:
                type: string
              example: /v1/tasks/11111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: '11111111-1111-4111-8111-111111111111'
                title: Hoàn thành bài tập SOA
                status: TODO
                priority: HIGH
                dueDate: '2026-10-15'
                assigneeId: '22222222-2222-4222-8222-222222222222'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          $ref: '#/components/responses/ValidationError'

        default:
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Tiêu đề của task
          example: Hoàn thành bài tập SOA
        status:
          type: string
          description: Trạng thái của task
          enum: [TODO, IN_PROGRESS, DONE]
          default: TODO
          example: TODO
        priority:
          type: string
          description: Mức độ ưu tiên của task
          enum: [LOW, MEDIUM, HIGH]
          default: MEDIUM
          example: HIGH
        dueDate:
          type: string
          format: date
          description: Hạn hoàn thành task
          example: '2026-10-15'
        assigneeId:
          type: string
          format: uuid
          description: UUID của người được giao task
          example: '22222222-2222-4222-8222-222222222222'

    Task:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
          description: UUID của task
          example: '11111111-1111-4111-8111-111111111111'
        title:
          type: string
          example: Hoàn thành bài tập SOA
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          example: TODO
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: HIGH
        dueDate:
          type: string
          format: date
          example: '2026-10-15'
        assigneeId:
          type: string
          format: uuid
          example: '22222222-2222-4222-8222-222222222222'

    Error:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
          example: https://example.vn/errors/validation-error
        title:
          type: string
          example: Validation error
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Dữ liệu task không hợp lệ.
        instance:
          type: string
          example: /v1/tasks

  responses:
    Unauthorized:
      description: Thiếu hoặc sai Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            title: Unauthorized
            status: 401
            detail: Dùng Authorization header với Bearer demo-token.

    ValidationError:
      description: Dữ liệu task không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            title: Validation error
            status: 422
            detail: Dữ liệu task không hợp lệ.

    ServerError:
      description: Lỗi máy chủ không mong đợi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT